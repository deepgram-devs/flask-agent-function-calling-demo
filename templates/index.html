<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepgram Voice Agent Demo</title>

  <!-- Deepgram Design System -->
  <link rel="stylesheet" href="https://unpkg.com/@deepgram/styles/dist/deepgram.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Local overrides -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    :root { color-scheme: dark; }
  </style>
</head>
<body>

  <!-- SocketIO client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

  <div class="dg-columns" style="height: 100vh; overflow: hidden;">

    <!-- LEFT PANEL: Demo selector + controls -->
    <aside class="dg-columns__aside" style="overflow-y: auto; border-right: 1px solid var(--dg-color-border);">
      <div style="padding: 1rem;">
        <div class="dg-page-heading">
          <h1 class="dg-page-heading__title">Voice Agent Demo</h1>
          <p class="dg-page-heading__subtitle">Select a demo to begin</p>
        </div>

        <!-- Demo selector grid -->
        <div id="demo-selector" style="display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-top: 1rem;">
          <!-- Cards injected by JS from GET /configs -->
          <div class="dg-spinner" id="configs-loading"></div>
        </div>

        <!-- New Demo button -->
        <button class="dg-btn dg-btn--secondary" style="width: 100%; margin-top: 1rem;" id="new-demo-btn">
          <i class="fa fa-plus"></i> New Demo
        </button>

        <hr style="border-color: var(--dg-color-border); margin: 1.5rem 0;">

        <!-- Voice / Language selects -->
        <div class="dg-form-field">
          <label class="dg-form-field__label">Language</label>
          <select class="dg-select" id="language-select">
            <option value="en-US">English (US)</option>
            <option value="en-PH">English (Philippines)</option>
            <option value="tl">Tagalog</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

        <div class="dg-form-field" style="margin-top: 0.75rem;">
          <label class="dg-form-field__label">Voice Model</label>
          <select class="dg-select" id="voice-model-select">
            <!-- Populated from /tts-models -->
          </select>
        </div>

        <div class="dg-form-field" style="margin-top: 0.75rem;">
          <label class="dg-form-field__label">Input Device</label>
          <select class="dg-select" id="inputDevice">
            <option value="default">Default Device</option>
          </select>
        </div>

        <hr style="border-color: var(--dg-color-border); margin: 1.5rem 0;">

        <!-- Start/Stop button -->
        <div style="text-align: center;">
          <div class="dg-status" id="status-indicator" data-status="idle">Ready</div>
          <button class="dg-btn dg-btn--primary" id="start-btn" style="margin-top: 1rem; width: 100%; font-size: 1.1rem; padding: 0.875rem;">
            <i class="fa fa-microphone"></i> Start Session
          </button>
        </div>
      </div>
    </aside>

    <!-- CENTER PANEL: Conversation transcript -->
    <main class="dg-columns__main" style="overflow: hidden; display: flex; flex-direction: column;">
      <div style="padding: 1rem 1rem 0; border-bottom: 1px solid var(--dg-color-border);">
        <h2 style="margin: 0; font-size: 1rem; font-weight: 600;" id="active-demo-name">No demo selected</h2>
      </div>
      <div class="conversation-log" id="conversation-log" style="flex: 1;">
        <div class="dg-alert dg-alert--info" id="welcome-message">
          Select a demo from the left panel and press Start Session.
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL: Event log / debug -->
    <aside class="dg-columns__aside dg-columns__aside--right" style="overflow: hidden; border-left: 1px solid var(--dg-color-border); display: flex; flex-direction: column;">
      <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--dg-color-border); font-weight: 600; font-size: 0.85rem;">
        Event Log
      </div>
      <div class="event-log" id="event-log"></div>
    </aside>

  </div>

  <!-- Builder slide-in panel -->
  <div class="builder-overlay" id="builder-overlay"></div>
  <div class="builder-panel" id="builder-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h2 style="margin: 0; font-size: 1.1rem; font-weight: 700;" id="builder-title">New Demo</h2>
      <button class="dg-btn dg-btn--ghost dg-btn--sm" id="builder-close">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <form id="builder-form">
      <input type="hidden" id="builder-id" name="id">

      <div class="dg-form-field">
        <label class="dg-form-field__label">Demo Name *</label>
        <input class="dg-input" type="text" id="builder-name" name="name" required placeholder="e.g. Acme Support Bot">
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Company</label>
        <input class="dg-input" type="text" id="builder-company" name="company" placeholder="e.g. Acme Corp">
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Personality</label>
        <textarea class="dg-textarea" id="builder-personality" name="personality" rows="2" placeholder="Brief personality description"></textarea>
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">System Prompt *</label>
        <textarea class="dg-textarea" id="builder-system-prompt" name="systemPrompt" rows="6" required placeholder="You are a helpful agent for..."></textarea>
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Greeting</label>
        <input class="dg-input" type="text" id="builder-greeting" name="greeting" placeholder="Hello, how can I help you today?">
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Language</label>
        <select class="dg-select" id="builder-language" name="language">
          <option value="en-US">English (US)</option>
          <option value="en-PH">English (Philippines)</option>
          <option value="tl">Tagalog</option>
          <option value="ar">Arabic</option>
        </select>
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Voice Model</label>
        <select class="dg-select" id="builder-voice-model" name="voiceModel">
          <!-- Populated from /tts-models -->
        </select>
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Hotword (optional)</label>
        <input class="dg-input" type="text" id="builder-hotword" name="hotword" placeholder="e.g. Hey Saga">
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label">Mode</label>
        <select class="dg-select" id="builder-mode" name="mode">
          <option value="voice_agent">Voice Agent</option>
          <option value="agent_assist">Agent Assist</option>
        </select>
      </div>

      <div class="dg-form-field">
        <label class="dg-form-field__label" style="margin-bottom: 0.5rem;">Functions</label>
        <div id="builder-functions" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Toggles injected by JS from FUNCTION_DEFINITIONS -->
        </div>
      </div>

      <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
        <button type="submit" class="dg-btn dg-btn--primary" style="flex: 1;">
          <i class="fa fa-save"></i> Save Demo
        </button>
        <button type="button" class="dg-btn dg-btn--ghost" id="builder-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    // ── SocketIO setup ─────────────────────────────────────
    const socket = io();

    // ── DOM refs ──────────────────────────────────────────
    const startBtn = document.getElementById('start-btn');
    const inputSelect = document.getElementById('inputDevice');
    const statusIndicator = document.getElementById('status-indicator');
    const conversationLog = document.getElementById('conversation-log');
    const eventLog = document.getElementById('event-log');

    // ── State ─────────────────────────────────────────────
    let isActive = false;
    let selectedConfig = null;
    let allTTSModels = [];
    let currentLanguage = 'en';
    let currentVoiceModel = 'aura-2-thalia-en';
    let currentVoiceName = '';

    // ── Status helper ─────────────────────────────────────
    function setStatus(status, label) {
      statusIndicator.dataset.status = status;
      statusIndicator.textContent = label;
    }

    // ── Config loader ─────────────────────────────────────
    async function loadConfigs() {
      const res = await fetch('/configs');
      const configs = await res.json();
      renderConfigCards(configs);
    }

    function renderConfigCards(configs) {
      const container = document.getElementById('demo-selector');
      container.innerHTML = '';
      if (configs.length === 0) {
        container.innerHTML = '<p style="color: var(--dg-color-text-muted); font-size: 0.85rem;">No demos yet. Click New Demo to create one.</p>';
        return;
      }
      configs.forEach(cfg => {
        const card = document.createElement('div');
        card.className = 'dg-card dg-card--selectable';
        card.dataset.configId = cfg.id;
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <div style="font-weight: 600;">${cfg.name}</div>
              <div style="font-size: 0.8rem; color: var(--dg-color-text-muted);">${cfg.company || ''} &middot; ${cfg.language || ''}</div>
            </div>
            <button class="dg-btn dg-btn--ghost dg-btn--xs edit-config-btn" data-config-id="${cfg.id}" title="Edit">
              <i class="fa fa-edit"></i>
            </button>
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (e.target.closest('.edit-config-btn')) return;
          selectConfig(cfg);
        });
        card.querySelector('.edit-config-btn').addEventListener('click', () => openBuilder(cfg));
        container.appendChild(card);
      });
    }

    function selectConfig(cfg) {
      selectedConfig = cfg;
      document.querySelectorAll('#demo-selector .dg-card--selectable').forEach(c => c.classList.remove('dg-card--selected'));
      const card = document.querySelector(`[data-config-id="${cfg.id}"]`);
      if (card) card.classList.add('dg-card--selected');
      document.getElementById('active-demo-name').textContent = cfg.name;
      // Sync language/voice selects
      if (cfg.language) document.getElementById('language-select').value = cfg.language;
      if (cfg.voiceModel) document.getElementById('voice-model-select').value = cfg.voiceModel;
      // Update current values for session start
      if (cfg.language) currentLanguage = cfg.language;
      if (cfg.voiceModel) currentVoiceModel = cfg.voiceModel;
    }

    // ── Builder panel ─────────────────────────────────────
    function openBuilder(existingConfig) {
      const panel = document.getElementById('builder-panel');
      const overlay = document.getElementById('builder-overlay');
      const title = document.getElementById('builder-title');
      const form = document.getElementById('builder-form');
      form.reset();
      if (existingConfig) {
        title.textContent = 'Edit Demo';
        document.getElementById('builder-id').value = existingConfig.id || '';
        document.getElementById('builder-name').value = existingConfig.name || '';
        document.getElementById('builder-company').value = existingConfig.company || '';
        document.getElementById('builder-personality').value = existingConfig.personality || '';
        document.getElementById('builder-system-prompt').value = existingConfig.systemPrompt || '';
        document.getElementById('builder-greeting').value = existingConfig.greeting || '';
        document.getElementById('builder-language').value = existingConfig.language || 'en-US';
        document.getElementById('builder-voice-model').value = existingConfig.voiceModel || '';
        document.getElementById('builder-hotword').value = existingConfig.hotword || '';
        document.getElementById('builder-mode').value = existingConfig.mode || 'voice_agent';
      } else {
        title.textContent = 'New Demo';
        document.getElementById('builder-id').value = '';
      }
      panel.classList.add('open');
      overlay.classList.add('open');
    }

    function closeBuilder() {
      document.getElementById('builder-panel').classList.remove('open');
      document.getElementById('builder-overlay').classList.remove('open');
    }

    document.getElementById('new-demo-btn').addEventListener('click', () => openBuilder(null));
    document.getElementById('builder-close').addEventListener('click', closeBuilder);
    document.getElementById('builder-cancel').addEventListener('click', closeBuilder);
    document.getElementById('builder-overlay').addEventListener('click', closeBuilder);

    document.getElementById('builder-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      // Generate id from name if new
      if (!data.id) {
        data.id = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }
      const res = await fetch('/configs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        closeBuilder();
        await loadConfigs();
      } else {
        alert('Failed to save demo config.');
      }
    });

    // ── TTS model loader ───────────────────────────────────
    function populateVoiceSelect(selectEl, lang) {
      const prev = selectEl.value;
      selectEl.innerHTML = '';
      const models = (allTTSModels || []).filter(m => (m.language || 'en') === lang || !lang);
      (models.length ? models : allTTSModels).forEach(model => {
        if (!model.name) return;
        const option = document.createElement('option');
        option.value = model.name;
        let displayName = model.display_name || model.name;
        displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
        let optionText = displayName;
        if (model.language) optionText += ' (' + model.language + ')';
        if (model.accent) optionText += ' - ' + model.accent + ' accent';
        option.text = optionText;
        option.dataset.voiceName = displayName;
        option.dataset.language = model.language || 'en';
        selectEl.appendChild(option);
      });
      // Try to restore previous selection
      if (prev) selectEl.value = prev;
    }

    function loadTTSModels() {
      fetch('/tts-models')
        .then(r => r.json())
        .then(data => {
          if (data.error) { console.error('Error loading TTS models:', data.error); return; }
          allTTSModels = (data.models || []).filter(m => m.name);

          // Build language dropdown from model list
          const langSet = new Set(allTTSModels.map(m => m.language || 'en'));
          const langSelect = document.getElementById('language-select');
          langSelect.innerHTML = '';
          Array.from(langSet).sort().forEach(lang => {
            const opt = document.createElement('option');
            opt.value = lang;
            opt.textContent = lang;
            langSelect.appendChild(opt);
          });

          // Set default language and populate voice models
          if (langSet.has(currentLanguage)) {
            langSelect.value = currentLanguage;
          } else if (langSelect.options.length) {
            currentLanguage = langSelect.value;
          }

          populateVoiceSelect(document.getElementById('voice-model-select'), currentLanguage);
          populateVoiceSelect(document.getElementById('builder-voice-model'), currentLanguage);

          // Set default voice model selection
          const voiceSel = document.getElementById('voice-model-select');
          if (currentVoiceModel) voiceSel.value = currentVoiceModel;
          if (voiceSel.value) {
            currentVoiceModel = voiceSel.value;
            const opt = voiceSel.options[voiceSel.selectedIndex];
            if (opt) currentVoiceName = opt.dataset.voiceName || '';
          }
        })
        .catch(err => console.error('Error fetching TTS models:', err));
    }

    document.getElementById('language-select').addEventListener('change', function() {
      currentLanguage = this.value;
      populateVoiceSelect(document.getElementById('voice-model-select'), currentLanguage);
    });

    document.getElementById('voice-model-select').addEventListener('change', function() {
      currentVoiceModel = this.value;
      const opt = this.options[this.selectedIndex];
      if (opt) {
        currentVoiceName = opt.dataset.voiceName || '';
        currentLanguage = opt.dataset.language || currentLanguage;
        document.getElementById('language-select').value = currentLanguage;
      }
    });

    // ── Audio devices ──────────────────────────────────────
    async function loadAudioDevices() {
      try {
        inputSelect.innerHTML = '';
        const defaultOption = document.createElement('option');
        defaultOption.value = 'default';
        defaultOption.text = 'Default Device';
        defaultOption.selected = true;
        inputSelect.appendChild(defaultOption);

        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputDevices = devices.filter(d => d.kind === 'audioinput');
        audioInputDevices.forEach((device, index) => {
          if (device.label) {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Microphone ${index + 1}`;
            inputSelect.appendChild(option);
          }
        });
        if (audioInputDevices.filter(d => d.label).length === 0) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          return loadAudioDevices();
        }
      } catch (err) {
        console.error('Error loading audio devices:', err);
        setStatus('error', 'Cannot access audio devices');
      }
    }
    navigator.mediaDevices.addEventListener('devicechange', loadAudioDevices);

    // ── Audio processing variables ─────────────────────────
    let audioContext;
    let mediaStream;
    let processor;
    let microphone;

    function floatToInt16(float32) {
      const out = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        out[i] = s < 0 ? Math.round(s * 32768) : Math.round(s * 32767);
      }
      return out;
    }

    function resampleFloatToInt16_16k(input, inSampleRate) {
      const target = 16000;
      if (!inSampleRate || inSampleRate === target) return floatToInt16(input);
      const ratio = inSampleRate / target;
      const newLen = Math.max(1, Math.round(input.length / ratio));
      const out = new Int16Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const idx = i * ratio;
        const i0 = Math.floor(idx);
        const i1 = Math.min(i0 + 1, input.length - 1);
        const frac = idx - i0;
        const sample = input[i0] + (input[i1] - input[i0]) * frac;
        const s = Math.max(-1, Math.min(1, sample));
        out[i] = s < 0 ? Math.round(s * 32768) : Math.round(s * 32767);
      }
      return out;
    }

    async function requestMicrophonePermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setStatus('connecting', 'Mic: Permission granted');
        stream.getTracks().forEach(t => t.stop());
        return true;
      } catch (err) {
        console.error('Error accessing microphone:', err);
        setStatus('error', 'Mic: Permission denied');
        return false;
      }
    }

    async function startAudioCapture() {
      try {
        const deviceId = inputSelect.value;
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (permissionErr) {
          console.error('Error getting microphone permission:', permissionErr);
          alert('Microphone permission denied: ' + permissionErr.message);
          return false;
        }
        try {
          const audioConstraints = {
            echoCancellation: true,
            noiseSuppression: true,
            channelCount: 1,
            sampleRate: { ideal: 16000 }
          };
          if (deviceId && deviceId !== 'default') {
            audioConstraints.deviceId = { exact: deviceId };
          }
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
          try { stream.getTracks().forEach(t => t.stop()); } catch(_) {}
        } catch (constraintErr) {
          console.error('Error with audio constraints, falling back:', constraintErr);
          mediaStream = stream;
        }
        try {
          // Create output AudioContext here (inside user gesture) so Chrome's
          // autoplay policy doesn't block audio playback later
          if (!audioOutputContext || audioOutputContext.state === 'closed') {
            audioOutputContext = new (window.AudioContext || window.webkitAudioContext)();
            nextPlayTime = audioOutputContext.currentTime;
          }
          if (audioOutputContext.state === 'suspended') {
            await audioOutputContext.resume();
          }

          audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
          if (audioContext.state === 'suspended') {
            try { await audioContext.resume(); } catch(_) {}
          }
          microphone = audioContext.createMediaStreamSource(mediaStream);
          const bufferSize = 1024;
          processor = audioContext.createScriptProcessor(bufferSize, 1, 1);
          microphone.connect(processor);
          const zeroGainNode = audioContext.createGain();
          zeroGainNode.gain.value = 0.0;
          processor.connect(zeroGainNode);
          zeroGainNode.connect(audioContext.destination);
          processor.onaudioprocess = function(e) {
            if (!isActive) return;
            const inputData = e.inputBuffer.getChannelData(0);
            const inRate = audioContext.sampleRate;
            let pcm16;
            if (inRate !== 16000) {
              pcm16 = resampleFloatToInt16_16k(inputData, inRate);
            } else {
              pcm16 = floatToInt16(inputData);
            }
            socket.emit('audio_data', { audio: pcm16.buffer, sampleRate: 16000 });
          };
          return true;
        } catch (audioErr) {
          console.error('Error setting up audio processing:', audioErr);
          if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
          alert('Error setting up audio processing: ' + audioErr.message);
          return false;
        }
      } catch (err) {
        console.error('Unexpected error in startAudioCapture:', err);
        alert('Unexpected error starting audio capture: ' + err.message);
        return false;
      }
    }

    function stopAudioCapture() {
      if (processor) { processor.disconnect(); processor = null; }
      if (microphone) { microphone.disconnect(); microphone = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
      stopAudioOutput();
    }

    // ── Audio output ───────────────────────────────────────
    let audioOutputContext = null;
    let nextPlayTime = 0;
    let audioOutputSampleRate = 16000;
    let lastSeq = -1;

    function playAudioOutput(audioData, sampleRate) {
      try {
        if (!audioOutputContext || audioOutputContext.state === 'closed') {
          // Fallback only -- context should already be created in startAudioCapture
          audioOutputContext = new (window.AudioContext || window.webkitAudioContext)();
          nextPlayTime = audioOutputContext.currentTime;
        }
        if (sampleRate) audioOutputSampleRate = sampleRate;
        const pcmData = new Int16Array(audioData);
        const floatData = new Float32Array(pcmData.length);
        for (let i = 0; i < pcmData.length; i++) {
          floatData[i] = pcmData[i] / 32768.0;
        }
        const audioBuffer = audioOutputContext.createBuffer(1, floatData.length, audioOutputSampleRate);
        audioBuffer.getChannelData(0).set(floatData);
        scheduleAudioBuffer(audioBuffer);
      } catch (err) {
        console.error('Error processing audio output:', err);
      }
    }

    function scheduleAudioBuffer(audioBuffer) {
      try {
        const source = audioOutputContext.createBufferSource();
        source.buffer = audioBuffer;
        const gainNode = audioOutputContext.createGain();
        gainNode.gain.value = 1.0;
        source.connect(gainNode);
        gainNode.connect(audioOutputContext.destination);
        const currentTime = audioOutputContext.currentTime;
        if (nextPlayTime <= currentTime + 0.03) {
          nextPlayTime = currentTime + 0.03;
        }
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
      } catch (err) {
        console.error('Error scheduling audio buffer:', err);
        nextPlayTime = audioOutputContext.currentTime;
      }
    }

    function stopAudioOutput() {
      nextPlayTime = 0;
      lastSeq = -1;
      if (audioOutputContext && audioOutputContext.state !== 'closed') {
        audioOutputContext.close();
        audioOutputContext = null;
      }
      audioOutputSampleRate = 16000;
    }

    // ── Start/Stop button ──────────────────────────────────
    startBtn.addEventListener('click', async () => {
      if (!isActive) {
        try {
          // Require a config to be selected before starting
          if (!selectedConfig) {
            alert('Please select a demo first.');
            return;
          }

          setStatus('connecting', 'Initializing audio...');

          const hasPermission = await requestMicrophonePermission();
          if (!hasPermission) {
            setStatus('error', 'Mic permission denied');
            alert('Microphone permission is required for the voice agent to work.');
            return;
          }

          const captureStarted = await startAudioCapture();
          if (!captureStarted) {
            setStatus('error', 'Audio capture failed');
            alert('Failed to start audio capture. Please check your microphone settings.');
            return;
          }

          setStatus('connecting', 'Starting agent...');

          // Send config_id (new) alongside industry (legacy backward compat)
          socket.emit('start_voice_agent', {
            inputDeviceId: inputSelect.value,
            config_id: selectedConfig.id,
            industry: selectedConfig.id,
            voiceModel: currentVoiceModel,
            voiceName: currentVoiceName,
            language: currentLanguage,
            browserAudio: true
          });

          startBtn.innerHTML = '<i class="fa fa-stop"></i> Stop Session';
          setStatus('active', 'Active');
          isActive = true;

          // Clear welcome message on first start
          const welcome = document.getElementById('welcome-message');
          if (welcome) welcome.remove();

        } catch (err) {
          console.error('Error in voice agent initialization:', err);
          setStatus('error', 'Error: ' + err.message);
          alert('Error initializing voice agent: ' + err.message);
          stopAudioCapture();
        }
      } else {
        socket.emit('stop_voice_agent');
        stopAudioCapture();
        startBtn.innerHTML = '<i class="fa fa-microphone"></i> Start Session';
        setStatus('idle', 'Ready');
        isActive = false;
      }
    });

    // ── SocketIO event handlers ────────────────────────────
    socket.on('connect', () => {
      console.log('Connected to server');
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from server');
      isActive = false;
      startBtn.innerHTML = '<i class="fa fa-microphone"></i> Start Session';
      setStatus('idle', 'Disconnected');
    });

    socket.on('error', (error) => {
      console.error('Socket error:', error);
      alert('An error occurred. Please check the console for details.');
    });

    socket.on('conversation_update', (data) => {
      appendConversationMessage(data);
    });

    socket.on('log_message', (data) => {
      appendEventLog(data);
    });

    socket.on('audio_output', (data) => {
      if (isActive) {
        if (typeof data.seq === 'number') {
          if (lastSeq !== -1 && data.seq !== lastSeq + 1) {
            console.warn('Audio chunk out of order', { expected: lastSeq + 1, got: data.seq });
          }
          lastSeq = data.seq;
        }
        playAudioOutput(data.audio, data.sampleRate);
      }
    });

    socket.on('stop_audio_output', () => {
      stopAudioOutput();
    });

    // ── Conversation display ───────────────────────────────
    function appendConversationMessage(data) {
      const div = document.createElement('div');
      div.style.cssText = 'margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 6px;';

      const roleLabel = document.createElement('span');
      roleLabel.style.cssText = 'font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.25rem;';

      const contentSpan = document.createElement('span');
      contentSpan.style.cssText = 'font-size: 0.9rem; line-height: 1.4;';
      contentSpan.textContent = data.content;

      if (data.role === 'assistant' || data.role === 'agent') {
        div.style.background = 'rgba(19, 239, 149, 0.05)';
        div.style.borderLeft = '3px solid #13ef95';
        roleLabel.style.color = '#13ef95';
        roleLabel.textContent = 'Agent';
      } else if (data.role === 'user') {
        div.style.background = 'rgba(255,255,255,0.04)';
        div.style.borderLeft = '3px solid #666';
        roleLabel.style.color = '#aaa';
        roleLabel.textContent = 'You';
      } else {
        div.style.background = 'rgba(255,200,0,0.05)';
        div.style.borderLeft = '3px solid #666';
        roleLabel.style.color = '#888';
        roleLabel.textContent = data.role || 'System';
      }

      div.appendChild(roleLabel);
      div.appendChild(contentSpan);
      conversationLog.appendChild(div);
      conversationLog.scrollTop = conversationLog.scrollHeight;
    }

    function appendEventLog(data) {
      const div = document.createElement('div');
      div.style.cssText = 'padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); word-break: break-all;';
      div.innerHTML = convertAnsiToHtml(data.message || JSON.stringify(data));
      eventLog.appendChild(div);
      eventLog.scrollTop = eventLog.scrollHeight;
    }

    function convertAnsiToHtml(text) {
      const colorMap = {
        '[38;5;231m': 'color: #fff;',
        '[38;5;116m': 'color: #87d7d7;',
        '[38;5;114m': 'color: #87d787;',
        '[38;5;183m': 'color: #d7afff;',
        '[38;5;186m': 'color: #d7d787;',
      };
      let html = text.replace(/\[0m/g, '');
      for (const [ansi, style] of Object.entries(colorMap)) {
        const parts = html.split(ansi);
        if (parts.length > 1) {
          html = parts.map((part, i) => {
            if (i === 0) return part;
            return `<span style="${style}">${part}</span>`;
          }).join('');
        }
      }
      return html;
    }

    // ── Function toggles in builder ────────────────────────
    const KNOWN_FUNCTIONS = [
      'agent_filler', 'find_customer', 'get_appointments',
      'get_orders', 'create_appointment', 'check_availability', 'end_call'
    ];

    function renderFunctionToggles() {
      const container = document.getElementById('builder-functions');
      container.innerHTML = '';
      KNOWN_FUNCTIONS.forEach(fn => {
        const label = document.createElement('label');
        label.style.cssText = 'display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.name = 'functions';
        cb.value = fn;
        cb.checked = true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(fn));
        container.appendChild(label);
      });
    }

    // ── Init ───────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      loadConfigs();
      loadTTSModels();
      loadAudioDevices();
      renderFunctionToggles();
    });
  </script>
</body>
</html>
